<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Cozy Vibe Labs</title>
  <desc id="desc">Cozy Vibe Labs logo, a steaming mug with a terminal prompt, next to the tagline "Small apps, built for fun with Claude." A terminal window shows the after-hours workflow: idea, vibe-code with Claude, ship for real.</desc>

  <!-- background -->
  <rect width="1200" height="400" rx="28" fill="#F7EBD8"/>

  <!-- logo mark: drawn on the 1024 icon grid, scaled down -->
  <g id="logo" transform="translate(40 36) scale(0.22)">
    <g fill="none" stroke="#D9774F" stroke-width="22" stroke-linecap="round">
      <path d="M418 192 C440 225 425 255 412 285 C400 315 402 330 420 340"/>
      <path d="M510 160 C535 220 525 260 510 300 C500 325 500 335 512 340"/>
      <path d="M604 192 C626 225 611 255 598 285 C586 315 588 330 606 340"/>
    </g>
    <path d="M720 484 H780 C840 484 868 520 868 576 C868 632 840 668 780 668 H720" fill="none" stroke="#3B2A4B" stroke-width="44"/>
    <rect x="280" y="385" width="464" height="418" rx="105" fill="#3B2A4B"/>
    <rect x="324" y="430" width="376" height="328" rx="62" fill="#F2A65A"/>
    <g fill="none" stroke="#3B2A4B" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M405 525 L470 586 L405 648"/>
      <path d="M506 655 H592"/>
    </g>
    <path d="M154 852 H870" stroke="#3B2A4B" stroke-width="44" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g id="title-block" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800">
    <text x="262" y="132" font-size="76" fill="#3B2A4B" letter-spacing="-1">Cozy Vibe</text>
    <text x="262" y="214" font-size="76" fill="#B8532E" letter-spacing="-1">Labs</text>
    <text x="64" y="304" font-size="30" font-weight="700" fill="#57466E">Small apps, built for fun with Claude.</text>
    <text x="64" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="400" fill="#8C7A86" letter-spacing="0.5">hobby projects · vibe-coded after hours</text>
  </g>

  <!-- terminal: the after-hours workflow -->
  <g id="terminal" transform="translate(712 52)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">
    <rect x="6" y="10" width="424" height="296" rx="24" fill="#3B2A4B" fill-opacity="0.16"/>
    <rect width="424" height="296" rx="24" fill="#3B2A4B"/>
    <circle cx="32" cy="30" r="7" fill="#D9774F"/>
    <circle cx="54" cy="30" r="7" fill="#F2A65A"/>
    <circle cx="76" cy="30" r="7" fill="#F7EBD8" fill-opacity="0.35"/>
    <text x="396" y="37" text-anchor="end" font-size="18" fill="#F7EBD8" fill-opacity="0.55">~/after-hours</text>
    <path d="M0 58 H424" stroke="#F7EBD8" stroke-opacity="0.12" stroke-width="2"/>

    <g fill="#F7EBD8">
      <text x="32" y="106"><tspan fill="#F2A65A" font-weight="700">›</tspan> idea --at 22:47</text>
      <text x="32" y="150"><tspan fill="#F2A65A" font-weight="700">›</tspan> vibe-code --with claude</text>
      <text x="32" y="194"><tspan fill="#F2A65A" font-weight="700">›</tspan> ship --for-real</text>
      <text x="32" y="238" fill="#F2A65A">✓ finished over perfect</text>
      <text x="32" y="270"><tspan fill="#F2A65A" font-weight="700">›</tspan></text>
    </g>
    <rect x="58" y="252" width="12" height="24" rx="2" fill="#F2A65A"/>
  </g>
</svg>
